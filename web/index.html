<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical Review Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><path d='M9 16h4l2-5 3 10 2-5h3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --border: #e3e6eb;
  --text: #1c2430; --muted: #5d6775; --faint: #8b94a1;
  --accent: #0f766e; --accent-soft: #e2f3f1; --accent-text: #0b5c56;
  --user: #0f766e; --user-text: #ffffff;
  --ok: #15803d; --ok-soft: #e4f4e9; --bad: #b42318; --bad-soft: #fde8e6; --warn: #a15c07; --warn-soft: #fdf1dc;
  --mark: #fff0a8; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1318; --panel: #171c23; --panel-2: #1e252e; --border: #2a323d;
    --text: #e6eaef; --muted: #a2acb8; --faint: #77818d;
    --accent: #2bb3a6; --accent-soft: #15302e; --accent-text: #7fdcd2;
    --user: #1f6f68; --user-text: #f2fbfa;
    --ok: #4ade80; --ok-soft: #14301f; --bad: #f87171; --bad-soft: #3a1a1a; --warn: #fbbf24; --warn-soft: #362a10;
    --mark: #5c4a00; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; color: inherit; }

/* layout */
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel);
  border-bottom: 1px solid var(--border); }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; letter-spacing: 0; }
.spacer { flex: 1; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted);
  border: 1px solid var(--border); white-space: nowrap; }
.btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.btn-ghost:hover { background: var(--panel-2); }
.body { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
main, aside { min-width: 0; }

/* sidebar */
aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 18px; }
.card + .card { margin-top: 18px; }
.section-title { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 8px; }
.patient-name { font-size: 17px; font-weight: 650; margin: 0; }
.patient-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 9px 10px; }
.stat b { display: block; font-size: 18px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.types { font-size: 13px; color: var(--muted); margin-top: 8px; }
.weeks { width: 100%; border-collapse: collapse; font-size: 13px; }
.weeks td { padding: 7px 4px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.weeks tr { cursor: pointer; }
.weeks tr:hover td { background: var(--panel-2); }
.weeks td:last-child { text-align: right; }
.goal-note { font-size: 12.5px; color: var(--muted); margin: -2px 0 6px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.met { background: var(--ok-soft); color: var(--ok); }
.pill.not_met { background: var(--bad-soft); color: var(--bad); }
.pill.indeterminate { background: var(--warn-soft); color: var(--warn); }
.phq { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }
.phq .pt { text-align: center; }
.phq .pt b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.phq .pt span { font-size: 11.5px; color: var(--muted); }
.phq .arrow { color: var(--faint); padding-bottom: 14px; }
.issue { display: flex; gap: 8px; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--border); cursor: pointer; }
.issue:hover { color: var(--accent-text); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.dot.high { background: var(--bad); } .dot.medium { background: var(--warn); }
.hint { font-size: 12px; color: var(--faint); margin-top: 6px; }

/* chat */
main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#chat { overflow-y: auto; padding: 24px 0 12px; }
.thread { max-width: 860px; margin: 0 auto; padding: 0 24px; }
.empty { text-align: center; padding: 6vh 0 10px; }
.empty h1 { font-size: 22px; letter-spacing: -.015em; margin: 0 0 6px; }
.empty p { color: var(--muted); margin: 0 auto 22px; max-width: 520px; }
.examples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.example { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  cursor: pointer; font-size: 13.5px; color: var(--text); box-shadow: var(--shadow); text-align: left; line-height: 1.45; }
.example:hover { border-color: var(--accent); }
.msg { display: flex; margin: 18px 0; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 100%; }
.msg.user .bubble { background: var(--user); color: var(--user-text); padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  max-width: 78%; white-space: pre-wrap; }
.msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px;
  padding: 16px 20px; box-shadow: var(--shadow); width: 100%; }
.answer > :first-child { margin-top: 0; }
.answer > :last-child { margin-bottom: 0; }
.answer h1, .answer h2, .answer h3 { font-size: 16px; margin: 18px 0 8px; letter-spacing: -.01em; }
.answer p, .answer ul, .answer ol { margin: 8px 0; }
.answer li { margin: 4px 0; }
.answer code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.answer .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; }
.answer table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.answer th, .answer td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.answer th { background: var(--panel-2); font-weight: 600; }
.answer tr:last-child td { border-bottom: 0; }
.answer blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
.cite { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.5; padding: 0 6px; margin: 0 1px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent-text); border: 0; cursor: pointer; vertical-align: baseline; }
.cite:hover { outline: 1px solid var(--accent); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.verified { font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.verified.ok { background: var(--ok-soft); color: var(--ok); }
.verified.warn { background: var(--warn-soft); color: var(--warn); }
details.tools { width: 100%; }
details.tools summary { cursor: pointer; color: var(--muted); }
details.tools ol { margin: 6px 0 0; padding-left: 20px; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); }
.unverified { margin-top: 8px; font-size: 12.5px; color: var(--warn); }
.pending { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: var(--bad); }

/* composer */
.composer-wrap { padding: 10px 24px 18px; background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
form.composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; background: var(--panel);
  border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
form.composer:focus-within { border-color: var(--accent); }
textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit;
  max-height: 180px; padding: 6px 0; }
.send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; width: 38px; height: 38px; cursor: pointer;
  display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .45; cursor: default; }
.foot { max-width: 860px; margin: 6px auto 0; font-size: 11.5px; color: var(--faint); text-align: center; }

/* document drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.35); opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel);
  border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .2s ease;
  display: grid; grid-template-rows: auto 1fr; z-index: 10; }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.drawer-head h2 { font-size: 15px; margin: 0; }
.drawer-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.drawer-body { overflow: auto; padding: 10px 0 24px; }
.line { display: grid; grid-template-columns: 44px 1fr; font: 12.5px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
.line .n { color: var(--faint); text-align: right; padding-right: 12px; user-select: none; }
.line .t { white-space: pre-wrap; word-break: break-word; padding-right: 18px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* responsive */
@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 34vh; padding: 14px 16px; }
  .examples { grid-template-columns: 1fr; }
  .thread, .composer-wrap { padding-left: 16px; padding-right: 16px; }
  header { padding: 10px 16px; }
  header .badge.model, .brand small { display: none; }
  .msg.user .bubble { max-width: 88%; }
  .msg.bot .bubble { padding: 14px; }
  .stat b { font-size: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M5 16h6l3-7 4 14 3-7h6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="brand">Clinical Review Chat<small>Answers computed from the saved abstraction · every quote checked against its source</small></div>
    <div class="spacer"></div>
    <span class="badge model" id="model-badge">model</span>
    <button class="btn-ghost" id="new-chat" type="button">New chat</button>
  </header>
  <div class="body">
    <aside id="side"><div class="hint">Loading abstraction…</div></aside>
    <main>
      <div id="chat"><div class="thread" id="thread"></div></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="q" rows="1" placeholder="Ask about the patient's care, attendance, minutes, goals or progress…" aria-label="Question"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <div class="foot">Enter to send · Shift+Enter for a new line · click a document tag such as <b>BH-D103</b> to open the source</div>
      </div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<section class="drawer" id="drawer" aria-label="Source document">
  <div class="drawer-head">
    <div style="flex:1"><h2 id="doc-title">Document</h2><p id="doc-sub"></p></div>
    <button class="btn-ghost" id="doc-close" type="button">Close</button>
  </div>
  <div class="drawer-body" id="doc-body"></div>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let DOC_IDS = new Set(), EXAMPLES = [], busy = false;

function shortDate(iso) { const [, m, d] = iso.split("-").map(Number); return `${MONTHS[m-1]} ${d}`; }
function weekLabel(w) {
  const [a, b] = w.split(" to "); const [, ma] = a.split("-"); const [, mb, db] = b.split("-");
  return ma === mb ? `${shortDate(a)}–${Number(db)}` : `${shortDate(a)}–${shortDate(b)}`;
}
const VERDICT = { met: "Met", not_met: "Not met", indeterminate: "Undetermined", no_goal_in_effect: "No goal" };
const TYPE = { individual_psychotherapy: "Individual", group_psychotherapy: "Group", family_psychotherapy: "Family" };
const range = (lo, hi) => lo === hi ? `${lo}` : `${lo}–${hi}`;

/* ---------- sidebar ---------- */
function renderSide(data) {
  $("#model-badge").textContent = data.model;
  const side = $("#side");
  if (!data.patients.length) { side.innerHTML = `<div class="hint">No patients yet. Run <code>python cli.py process</code> first.</div>`; return; }
  side.innerHTML = data.patients.map(p => {
    const s = p.sessions, g = p.goal;
    const types = Object.entries(s.by_type).map(([t, v]) => `${TYPE[t] || t} ${v.established}`).join(" · ");
    const weeks = p.weeks.map(w => `<tr data-week="${esc(w.week)}"><td>${esc(weekLabel(w.week))}</td><td>${esc(w.therapy_days)} d</td>
        <td>${esc(w.minutes)} min</td><td><span class="pill ${esc(w.verdict)}" title="${esc(w.why)}">${VERDICT[w.verdict] || esc(w.verdict)}</span></td></tr>`).join("");
    const phq = p.measures.map((m, i) => `${i ? '<span class="arrow">→</span>' : ""}<div class="pt"><b>${m.total_score ?? "?"}</b><span>${esc(shortDate(m.completed_date))}</span></div>`).join("");
    const instr = p.measures[0]?.instrument || "Measures";
    const issues = p.issues.map(i => `<div class="issue" data-issue="${esc(i.description)}"><span class="dot ${esc(i.severity)}"></span><span>${esc(i.description)}</span></div>`).join("");
    return `
      <div class="card">
        <p class="patient-name">${esc(p.name || p.mrn)}</p>
        <div class="patient-meta">MRN ${esc(p.mrn)}${p.dob ? " · DOB " + esc(p.dob) : ""}<br>${esc(shortDate(p.period[0]))} – ${esc(shortDate(p.period[1]))}, ${esc(p.period[0].slice(0,4))} · ${p.documents} documents</div>
        <div class="stats">
          <div class="stat"><b>${s.total === s.total_possible ? s.total : range(s.total, s.total_possible)}</b><span>sessions</span></div>
          <div class="stat"><b>${s.days}</b><span>therapy days</span></div>
          <div class="stat"><b>${range(p.minutes.lo, p.minutes.hi)}</b><span>minutes</span></div>
        </div>
        <div class="types">${esc(types)}</div>
      </div>
      ${g ? `<div class="card"><p class="section-title">Weekly goal</p>
        <p class="goal-note">At least ${g.min_days} therapy days and ${g.min_minutes} min per Mon–Sun week (${esc(g.doc_id)})</p>
        <table class="weeks">${weeks}</table><div class="hint">Click a week to ask about it</div></div>` : ""}
      ${p.measures.length ? `<div class="card"><p class="section-title">${esc(instr)} scores</p><div class="phq">${phq}</div></div>` : ""}
      ${issues ? `<div class="card"><p class="section-title">Open issues</p>${issues}</div>` : ""}`;
  }).join("");
  side.querySelectorAll("tr[data-week]").forEach(tr => tr.onclick = () =>
    fill(`Explain the treatment-plan goal verdict for the week ${tr.dataset.week}: which contacts counted, how the minutes were calculated, and what is uncertain.`));
  side.querySelectorAll(".issue").forEach(el => el.onclick = () =>
    fill(`Explain this issue and what documentation would resolve it: ${el.dataset.issue}`));
}

/* ---------- chat ---------- */
function renderEmpty() {
  $("#thread").innerHTML = `<div class="empty"><h1>Ask about the record</h1>
    <p>Numbers come from code over the reconciled abstraction; the model only chooses queries and writes the answer. Answers take about 15–60 seconds.</p>
    <div class="examples">${EXAMPLES.map(q => `<button class="example" type="button">${esc(q)}</button>`).join("")}</div></div>`;
  $("#thread").querySelectorAll(".example").forEach(b => b.onclick = () => ask(b.textContent));
}
function fill(text) { const q = $("#q"); q.value = text; grow(); q.focus(); updateSend(); }
function scrollDown() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }
function addMsg(cls, html) {
  $("#thread").querySelector(".empty")?.remove();
  const m = document.createElement("div"); m.className = `msg ${cls}`; m.innerHTML = `<div class="bubble">${html}</div>`;
  $("#thread").appendChild(m); scrollDown(); return m.querySelector(".bubble");
}
function markdown(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
  return `<p>${esc(text).replace(/\n/g, "<br>")}</p>`;
}
function linkDocs(root) {
  // "[BH-D013, BH-D014]" or a bare "BH-D013" -> clickable tags (brackets dropped); other IDs (MRNs, encounters) stay text
  const ID = "[A-Z]{2,}-[A-Z]?\\d{2,}[A-Za-z0-9~]*";
  const re = new RegExp(`\\[(${ID}(?:\\s*[,;]\\s*${ID})*)\\]|\\b(${ID})\\b`, "g");
  const idsIn = m => (m[1] || m[2]).split(/\s*[,;]\s*/);
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n =>
    n.parentElement.closest("button, a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const t = node.nodeValue;
    const hits = [...t.matchAll(re)].filter(m => idsIn(m).some(id => DOC_IDS.has(id)));
    if (!hits.length) continue;
    const frag = document.createDocumentFragment(); let last = 0;
    for (const m of hits) {
      frag.append(t.slice(last, m.index));
      idsIn(m).forEach(id => {
        if (!DOC_IDS.has(id)) { frag.append(id + " "); return; }
        const b = document.createElement("button"); b.type = "button"; b.className = "cite"; b.textContent = id; b.dataset.doc = id;
        frag.append(b);
      });
      last = m.index + m[0].length;
    }
    frag.append(t.slice(last)); node.replaceWith(frag);
  }
  root.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
}
function renderAnswer(bubble, r) {
  const c = r.citations || { checked: 0, verified: 0, unverified: [] };
  const allOk = c.checked === c.verified;
  const cost = r.cost_usd != null ? ` · $${Number(r.cost_usd).toFixed(4)}` : "";
  const calls = (r.tool_calls || []).map(t => `<li>${esc(t.tool)}(${esc(JSON.stringify(t.args))})</li>`).join("");
  bubble.innerHTML = `<div class="answer">${markdown(r.answer || "")}</div>
    ${c.unverified?.length ? `<div class="unverified">Quotes not found in the cited documents: ${c.unverified.map(u => `“${esc(u.quote)}”`).join("; ")}</div>` : ""}
    <div class="meta">
      ${c.checked ? `<span class="verified ${allOk ? "ok" : "warn"}">${allOk ? "✓" : "!"} ${c.verified}/${c.checked} quotes verified</span>` : `<span>No quotations to check</span>`}
      <span>${r.latency_s}s · ${r.llm_calls} model calls · ${(r.input_tokens + r.output_tokens).toLocaleString()} tokens${cost}</span>
      ${calls ? `<details class="tools"><summary>Queries used (${r.tool_calls.length})</summary><ol>${calls}</ol></details>` : ""}
    </div>`;
  linkDocs(bubble.querySelector(".answer"));
}
async function ask(question) {
  question = question.trim(); if (!question || busy) return;
  busy = true; updateSend(); $("#q").value = ""; grow();
  addMsg("user", esc(question));
  const bubble = addMsg("bot", `<div class="pending"><div class="spinner"></div><span>Querying the abstraction… <b id="elapsed">0</b>s</span></div>`);
  const t0 = Date.now(); const timer = setInterval(() => { const e = bubble.querySelector("#elapsed"); if (e) e.textContent = Math.round((Date.now() - t0) / 1000); }, 500);
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
    renderAnswer(bubble, r);
  } catch (e) {
    bubble.innerHTML = `<div class="error">Could not answer: ${esc(e.message)}</div>`;
  } finally { clearInterval(timer); busy = false; updateSend(); scrollDown(); }
}

/* ---------- source drawer ---------- */
function quoteRegex(fragment) {
  const parts = fragment.replace(/\\\|/g, "|").trim().split(/\s+/).map(w =>
    w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[-–—−]/g, "[-–—−]").replace(/['’‘]/g, "['’‘]"));
  return new RegExp(parts.join("\\s+"), "gi");
}
function openDoc(docId, block) {
  const quotes = [];
  if (block) for (const m of block.textContent.matchAll(/“([^”]{4,})”/g))
    m[1].split(/…|\.\.\./).map(s => s.trim().replace(/^[\s.,;:]+|[\s.,;:]+$/g, "")).filter(s => s.length >= 5).forEach(s => quotes.push(s));
  $("#doc-title").textContent = docId; $("#doc-sub").textContent = "Loading…"; $("#doc-body").innerHTML = "";
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  fetch(`/api/doc?id=${encodeURIComponent(docId)}`).then(r => r.json()).then(d => {
    if (d.error) throw new Error(d.error);
    $("#doc-title").textContent = `${d.doc_id} · ${d.title || ""}`;
    const ranges = [];
    for (const q of quotes) for (const m of d.text.matchAll(quoteRegex(q))) ranges.push([m.index, m.index + m[0].length]);
    ranges.sort((a, b) => a[0] - b[0]);
    $("#doc-sub").textContent = `${d.filename}` + (quotes.length ? ` · ${ranges.length ? "quoted passages highlighted" : "quoted passages not found in this document"}` : "");
    let off = 0;
    $("#doc-body").innerHTML = d.text.replace(/\n$/, "").split("\n").map((line, i) => {
      const s = off, e = off + line.length; off = e + 1; let html = "", pos = s;
      for (const [a, b] of ranges) {
        if (b <= pos || a >= e) continue;
        const from = Math.max(a, pos), to = Math.min(b, e);
        html += esc(d.text.slice(pos, from)) + `<mark>${esc(d.text.slice(from, to))}</mark>`; pos = to;
      }
      html += esc(d.text.slice(pos, e));
      return `<div class="line"><span class="n">${i + 1}</span><span class="t">${html || " "}</span></div>`;
    }).join("");
    $("#doc-body").querySelector("mark")?.scrollIntoView({ block: "center" });
  }).catch(e => { $("#doc-sub").textContent = `Could not load: ${e.message}`; });
}
function closeDoc() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

/* ---------- wiring ---------- */
const q = $("#q");
function grow() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; }
function updateSend() { $("#send").disabled = busy || !q.value.trim(); }
q.addEventListener("input", () => { grow(); updateSend(); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
$("#composer").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
$("#new-chat").onclick = () => { if (!busy) renderEmpty(); };
$("#thread").addEventListener("click", e => {
  const b = e.target.closest(".cite"); if (!b) return;
  openDoc(b.dataset.doc, b.closest("li, p, td, blockquote"));
});
$("#scrim").onclick = closeDoc; $("#doc-close").onclick = closeDoc;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDoc(); });

fetch("/api/overview").then(r => r.json()).then(data => {
  if (data.error) throw new Error(data.error);
  DOC_IDS = new Set(data.documents.map(d => d.doc_id)); EXAMPLES = data.examples;
  renderSide(data); renderEmpty();
}).catch(e => { $("#side").innerHTML = `<div class="error">Could not load the abstraction: ${esc(e.message)}</div>`; renderEmpty(); });
</script>
</body>
